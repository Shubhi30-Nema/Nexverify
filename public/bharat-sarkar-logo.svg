<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="440" height="180">
  <style>
    .hindi-text { font-family: 'Noto Sans Devanagari', 'Mangal', 'Kohinoor Devanagari', 'Inter', sans-serif; font-weight: 800; font-size: 34px; fill: #111111; }
    .gov-text { font-family: 'Arial', 'Helvetica', 'Inter', sans-serif; font-weight: 800; font-size: 35px; fill: #111111; letter-spacing: 0.5px; }
    .of-text { font-family: 'Arial', 'Helvetica', 'Inter', sans-serif; font-weight: 800; font-size: 38px; fill: #111111; }
    .in-orange { font-family: 'Arial', 'Helvetica', 'Inter', sans-serif; font-weight: 900; font-size: 38px; fill: #F47216; }
    .dia-blue { font-family: 'Arial', 'Helvetica', 'Inter', sans-serif; font-weight: 900; font-size: 38px; fill: #000A93; }
    .satyameva { font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif; font-weight: 700; font-size: 15px; fill: #111111; }
  </style>

  <!-- Left: Emblem of India (Ashoka Lion Capital) -->
  <g transform="translate(10, 5)">
    <!-- Main Lions Head and Mane Outline -->
    <!-- Front Lion Head -->
    <path d="M45,35 C45,20 52,8 65,8 C78,8 85,20 85,35 C85,42 82,48 78,52 C83,55 88,60 90,68 C92,76 88,85 82,90 C85,96 82,105 75,110 C70,113 65,114 65,114 C65,114 60,113 55,110 C48,105 45,96 48,90 C42,85 38,76 40,68 C42,60 47,55 52,52 C48,48 45,42 45,35 Z" fill="#111111"/>
    <!-- Left Lion Head Profile -->
    <path d="M45,30 C35,20 20,22 15,35 C10,48 18,60 25,65 C20,72 22,82 30,88 C26,95 30,105 40,110 L48,90 C42,85 38,76 40,68 C42,60 45,55 45,30 Z" fill="#111111"/>
    <!-- Right Lion Head Profile -->
    <path d="M85,30 C95,20 110,22 115,35 C120,48 112,60 105,65 C110,72 108,82 100,88 C104,95 100,105 90,110 L82,90 C88,85 92,76 90,68 C88,60 85,55 85,30 Z" fill="#111111"/>

    <!-- Eyes & Muzzle Details -->
    <circle cx="57" cy="28" r="3" fill="#ffffff"/>
    <circle cx="73" cy="28" r="3" fill="#ffffff"/>
    <path d="M60,35 Q65,40 70,35 Q65,42 60,35 Z" fill="#ffffff"/>
    <!-- Mane Texture Highlights -->
    <path d="M52,48 Q65,42 78,48 M50,65 Q65,58 80,65 M48,82 Q65,75 82,82" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- Abacus Base -->
    <rect x="25" y="115" width="80" height="14" rx="2" fill="#111111"/>
    <!-- Ashoka Chakra (Wheel) in Center of Abacus -->
    <circle cx="65" cy="122" r="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <circle cx="65" cy="122" r="1.5" fill="#111111"/>
    <!-- Chakra Spokes -->
    <line x1="65" y1="116" x2="65" y2="128" stroke="#111111" stroke-width="1"/>
    <line x1="59" y1="122" x2="71" y2="122" stroke="#111111" stroke-width="1"/>
    <line x1="61" y1="118" x2="69" y2="126" stroke="#111111" stroke-width="1"/>
    <line x1="61" y1="126" x2="69" y2="118" stroke="#111111" stroke-width="1"/>

    <!-- Bull & Horse Silhouette Accents on Abacus -->
    <circle cx="38" cy="122" r="3" fill="#ffffff"/>
    <circle cx="92" cy="122" r="3" fill="#ffffff"/>

    <!-- Bell Lotus Base -->
    <path d="M30,129 C40,140 90,140 100,129 C95,147 35,147 30,129 Z" fill="#111111"/>

    <!-- Satyameva Jayate (सत्यमेव जयते) Text at Bottom -->
    <text x="65" y="165" text-anchor="middle" class="satyameva">सत्यमेव जयते</text>
  </g>

  <!-- Middle: Tricolor Vertical Bar -->
  <!-- Top Orange Bar -->
  <rect x="140" y="32" width="6" height="42" rx="3" fill="#F47216"/>
  <!-- Bottom Green Bar -->
  <rect x="140" y="98" width="6" height="42" rx="3" fill="#006837"/>

  <!-- Right: Government Text Typography -->
  <!-- Line 1: भारत सरकार -->
  <text x="160" y="55" class="hindi-text">भारत सरकार</text>
  
  <!-- Line 2: GOVERNMENT -->
  <text x="160" y="96" class="gov-text">GOVERNMENT</text>

  <!-- Line 3: OF INDIA -->
  <text x="160" y="138">
    <tspan class="of-text">OF </tspan>
    <tspan class="in-orange">IN</tspan>
    <tspan class="dia-blue">DIA</tspan>
  </text>
</svg>
